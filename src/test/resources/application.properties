# ---------------------------------------------------------------------------
# TEST-ONLY configuration. No real credentials, no live services.
#
# This file must be named application.properties, NOT application-test.properties:
# a profile-specific file only activates under @ActiveProfiles("test"), and
# GhbliapiApplicationTests deliberately carries no such annotation.
#
# NOTE ON SHADOWING: Spring Boot resolves classpath:/application.properties to the
# FIRST match on the classpath, and target/test-classes precedes target/classes.
# So this file REPLACES src/main/resources/application.properties during tests —
# it does not merge with it. Anything the context needs at startup must be
# restated here, which is why the two Stability keys appear below.
# ---------------------------------------------------------------------------

spring.application.name=ghbliapi

# ---------------------------------------------------------------------------
# Embedded MongoDB (flapdoodle spring3x 4.33.0)
# ---------------------------------------------------------------------------

# REQUIRED. The flapdoodle jar self-activates via AutoConfiguration.imports for
# every @SpringBootTest and throws
#   "set the de.flapdoodle.mongodb.embedded.version property or define your own
#    IFeatureAwareVersion bean to use embedded MongoDB"
# until this is set. Do NOT try to gate it with spring.autoconfigure.exclude —
# that fails silently and the tests then hit the real mongod on 27017 and pass green.
#
# 7.0.14 is chosen because that exact build is already cached in ~/.embedmongo,
# so no ~600MB download is needed. Any version flapdoodle can resolve works;
# changing this triggers a fresh download.
de.flapdoodle.mongodb.embedded.version=7.0.14

# Deliberately NOT set: spring.data.mongodb.uri / .host / .port.
# Flapdoodle picks a free port, starts mongod on it, and publishes host, port and
# uri back into the Environment itself. Pinning a uri here would either point the
# tests at the live local server or, if it referenced an unset ${MONGODB_URI},
# break context startup outright.
spring.data.mongodb.database=ghbli-test

# Mirrors production. Spring Data MongoDB has had auto-index-creation OFF by
# default since 3.0, so @Indexed(unique = true) on User.email would create no
# index and enforce nothing — duplicates would insert silently.
# UserIndexTest asserts the index really exists.
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# Stability AI — placeholders only, never called in tests
#
# GhibliArtService injects @Value("${stability.api.key}") and
# @Value("${stability.api.base-url}") with NO defaults, and @Value hard-fails at
# context startup when a placeholder cannot be resolved. Because this file shadows
# the main one (see above), omitting these two breaks every @SpringBootTest —
# including the pre-existing contextLoads().
#
# The base-url must still parse as a URL: it is the ${...} in @FeignClient(url = ...),
# which Feign validates when the client proxy is built.
# ---------------------------------------------------------------------------

stability.api.key=test-key-not-a-real-credential
stability.api.base-url=http://localhost:65535

# ---------------------------------------------------------------------------
# JWT — a fixed test-only key, NOT a credential
#
# Required for the same reason as the two keys above: JwtService injects
# @Value("${jwt.secret}") with no default, and this file shadows the main one, so
# without the key here every @SpringBootTest fails at context startup with
# "Could not resolve placeholder 'jwt.secret'" — including contextLoads().
#
# Hardcoded rather than random per run so that a token minted in one test can be
# asserted on in another, and so a failure is reproducible. It signs nothing real:
# the value below is public in the repository and must never appear in a deployed
# application.properties.
#
# Decodes to exactly 32 bytes, which is the HS256 minimum. Shortening it by one
# character makes Keys.hmacShaKeyFor throw WeakKeyException and every test fail at
# startup rather than at the assertion.
# ---------------------------------------------------------------------------

jwt.secret=Z2hibGktdGVzdC1zaWduaW5nLWtleS0zMi1ieXRlcyE=

# One hour. Long enough that no test can flake by crossing the boundary mid-run,
# short enough to stay obviously test-shaped. Tests that need an EXPIRED token build
# a JwtService with a negative expiration instead of waiting this out.
jwt.expiration=3600000


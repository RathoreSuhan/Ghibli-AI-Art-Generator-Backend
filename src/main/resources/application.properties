# ---------------------------------------------------------------------------
# Live configuration for ghbliapi. This file IS tracked by git, so it holds no literal
# secrets: every sensitive value is resolved from an environment variable at startup.
#
#   STABILITY_API_KEY     Stability AI key (starts with "sk-")
#   MONGODB_URI           mongodb+srv:// string from Atlas > Connect > Drivers
#   JWT_SECRET            Base64-encoded HS256 key, at least 32 bytes
#   CORS_ALLOWED_ORIGINS  browser origins allowed to call this API (deployment only)
#   PORT                  injected by Render; do not set it by hand
#
# Set them in your shell or IDE run configuration — never by replacing the ${...} below.
# On Render every one of them is a dashboard entry, so a deploy needs no edit to this file.
# application-example.properties is the annotated reference for every key here; keep the
# two in step, and never commit a real key to either.
# ---------------------------------------------------------------------------

spring.application.name=ghbliapi

# ---------------------------------------------------------------------------
# HTTP server
# ---------------------------------------------------------------------------

# Render assigns the port and injects it as PORT. A container that hardcodes 8080 is
# unreachable there ("no open ports detected") — locally the default keeps 8080.
server.port=${PORT:8080}
# Render terminates TLS at its edge and forwards plain HTTP inwards, so without this the
# app sees http:// on an internal address and any URL it builds itself (the ProblemDetail
# "instance", redirects) leaks that instead of the public https origin.
server.forward-headers-strategy=framework

stability.api.base-url=https://api.stability.ai
stability.api.key=${STABILITY_API_KEY:}
# Default text-to-image engine; can be overridden via env or IDE run config.
stability.api.text-engine=${STABILITY_TEXT_ENGINE:stable-diffusion-xl-1024-v1-0}
# Default image-to-image engine; kept separate for flexibility.
stability.api.image-engine=${STABILITY_IMAGE_ENGINE:stable-diffusion-xl-1024-v1-0}
# Increased multipart limits so photo uploads do not fail with HTTP 413 in PhotoToArt flow.
spring.servlet.multipart.max-file-size=20MB
# Keep request limit aligned with file limit for single-image plus prompt multipart requests.
spring.servlet.multipart.max-request-size=20MB

# MongoDB Atlas. Set MONGODB_URI to the mongodb+srv:// string from Atlas > Connect > Drivers.
# The localhost fallback keeps a clean clone runnable, but note it is NOT Atlas: with
# MONGODB_URI unset the app starts happily against the mongod on 127.0.0.1:27017 and nothing
# says so. The fallback is still needed — without it an unset var binds the literal string
# "${MONGODB_URI}" and later surfaces as a misleading "connection string is invalid".
spring.data.mongodb.uri=${MONGODB_URI:}
# Required, and silent when missing: Spring Data MongoDB defaulted auto-index-creation to
# false in 3.0, so @Indexed(unique = true) on User.email creates no index and enforces
# nothing — two accounts can share one address, and it only shows up much later.
spring.data.mongodb.auto-index-creation=true


# ---------------------------------------------------------------------------
# JWT authentication  (required from Phase 2 onward)
# ---------------------------------------------------------------------------

jwt.secret=${JWT_SECRET}

# Token lifetime in MILLISECONDS (86400000 = 24 hours). AuthResponse.expiresIn reports it
# to the frontend in SECONDS — JwtService.getExpiresInSeconds does that conversion.
jwt.expiration=86400000

# ---------------------------------------------------------------------------
# CORS  (the one thing a deployment must change)
# ---------------------------------------------------------------------------

# Comma-separated list of browser origins allowed to call this API. Set
# CORS_ALLOWED_ORIGINS on Render to the Vercel URL(s) — nothing in the Java code has to
# change. An entry containing '*' is treated as a pattern, which is how the per-deployment
# Vercel preview URLs are covered, e.g.
#   https://ghbli-ai.vercel.app,https://ghbli-ai-*.vercel.app
# The default is local development only; it is what the CORS tests assert against.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ---------------------------------------------------------------------------
# Actuator  (health check for Render, and for keeping a free instance warm)
# ---------------------------------------------------------------------------

# Only health is exposed over HTTP. /actuator/health is the one endpoint SecurityConfig
# leaves open, so widening this line would publish those endpoints unauthenticated too.
management.endpoints.web.exposure.include=health
# Mongo is deliberately left out of the aggregate status. Render fails a deploy when the
# health check answers non-200, so with the Mongo indicator on, a paused Atlas cluster
# would take the entire service down instead of only failing the calls that need a database.
management.health.mongo.enabled=false

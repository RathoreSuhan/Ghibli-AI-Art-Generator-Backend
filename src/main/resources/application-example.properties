# ---------------------------------------------------------------------------
# Example configuration for ghbliapi. PLACEHOLDER VALUES ONLY.
#
# Copy the keys you need into src/main/resources/application.properties (which is
# git-ignored and holds the real secrets). Never commit a real API key.
# ---------------------------------------------------------------------------

spring.application.name=ghbliapi

# ---------------------------------------------------------------------------
# Stability AI  (required — the app will not start without key and base-url,
#                both are read with @Value and hard-fail at context startup)
# ---------------------------------------------------------------------------

# Your Stability AI key, from https://platform.stability.ai/account/keys
stability.api.key=REPLACE_WITH_YOUR_STABILITY_API_KEY

# Stability REST host. No trailing slash — the code appends /v1/generation/...
stability.api.base-url=https://api.stability.ai

# Engine used by POST /api/v1/generate-from-text.
# The old v1-6 engine id was retired; SDXL is the current default.
stability.api.text-engine=stable-diffusion-xl-1024-v1-0

# Engine used by POST /api/v1/generate (image-to-image).
stability.api.image-engine=stable-diffusion-xl-1024-v1-0

# ---------------------------------------------------------------------------
# Multipart uploads  (REQUIRED — verify these are present in your real file)
#
# Spring Boot defaults max-file-size to 1MB and max-request-size to 10MB, but
# both the frontend and GhibliArtService accept init images up to 5MB. Without
# the override below, every upload between 1MB and 5MB fails with
# MaxUploadSizeExceededException (now surfaced as a 413 ProblemDetail) before
# the controller is ever reached.
# ---------------------------------------------------------------------------

spring.servlet.multipart.max-file-size=5MB
# Headroom over max-file-size for the prompt field and multipart boundaries.
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# MongoDB Atlas  (required from Phase 1 onward)
# ---------------------------------------------------------------------------

# Atlas connection string, from Atlas > Cluster > Connect > Drivers.
# Shape: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/ghbli?retryWrites=true&w=majority
#
# The ${VAR:default} form reads MONGODB_URI from the environment when set. The default
# after the colon is not decoration — WITHOUT it, an unset MONGODB_URI does NOT fail
# fast. Spring binds the literal string "${MONGODB_URI}" into MongoProperties and the
# driver later rejects it as "connection string is invalid", pointing at Mongo rather
# than at the missing variable. (This is the opposite of @Value("${...}"), which hard-
# fails at context startup. Same syntax, two different failure modes.)
#
# ⚠️ The flip side: because the default is a LOCAL server, an unset MONGODB_URI starts
# cleanly against the mongod already listening on 127.0.0.1:27017. Everything works and
# nothing says "you are not on Atlas". If the Atlas claim matters, put the real
# mongodb+srv:// string straight into application.properties (git-ignored) the way
# stability.api.key is handled, rather than relying on the env var.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ghbli}

# REQUIRED, and silent when missing.
# Spring Data MongoDB set MongoMappingContext.autoIndexCreation = false by default in
# 3.0. With this key absent, @Indexed(unique = true) on User.email creates NO index and
# enforces NOTHING: two accounts with the same address insert successfully, and the
# breakage only shows up later as duplicate logins. There is no warning in the log.
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# JWT authentication  (required from Phase 2 onward)
# ---------------------------------------------------------------------------

# Signing key for HS256, Base64-encoded. Generate your own and paste it here:
#
#     openssl rand -base64 32
#
# On Windows without openssl, PowerShell does the same thing:
#
#     [Convert]::ToBase64String((1..32 | % { Get-Random -Max 256 }))
#
# This value must be BASE64 and must decode to at least 32 bytes (256 bits).
# Keys.hmacShaKeyFor rejects anything shorter with a WeakKeyException rather than
# padding it, because HS256's security is capped by the key length. Note that a
# human passphrase like "changeit" IS valid Base64 — it decodes to 6 bytes and then
# fails on length, so the error will say "too short" when the real mistake was
# pasting a password where key material belongs.
#
# JwtService reads this with @Value and no default, so a missing or malformed value
# fails the context at startup instead of falling back to a shared known key.
# Changing it invalidates every token already issued, which is the intended way to
# force a global logout.
jwt.secret=REPLACE_WITH_BASE64_32_BYTE_SECRET

# Token lifetime in MILLISECONDS (86400000 = 24 hours). Optional — JwtService
# defaults to this exact value when the key is absent.
#
# Watch the units: this property is milliseconds, while the expiresIn field in the
# auth response is SECONDS, following the expires_in convention of RFC 6749.
#
# There is no refresh token and no revocation list, so this figure is also the
# window during which a stolen or stale token stays valid. Shorten it if that
# matters more than not having to log in again.
jwt.expiration=86400000


# ---------------------------------------------------------------------------
# Reference configuration for ghbliapi. PLACEHOLDER VALUES ONLY — never commit a real
# API key, connection string or signing secret to this file.
#
# This is the committed documentation of every key the application reads. The live file is
# src/main/resources/application.properties, which resolves each sensitive value from an
# environment variable (${STABILITY_API_KEY}, ${MONGODB_URI}, ${JWT_SECRET}) rather than
# holding a literal — so the two files stay in sync and neither one carries a secret.
#
# Deployment (Render) adds two more variables that never matter locally:
# ${CORS_ALLOWED_ORIGINS}, which is the only value that has to change when the frontend
# moves to its Vercel URL, and ${PORT}, which Render injects itself.
#
# Set the environment variables in your shell, your IDE run configuration, or a local
# .env that your shell sources. Keep this file and application.properties in step: a key
# added to one and not the other is how a clean clone ends up failing to start.
# ---------------------------------------------------------------------------

spring.application.name=ghbliapi


# ---------------------------------------------------------------------------
# HTTP server
# ---------------------------------------------------------------------------

# Render injects PORT into the container and routes only to that port; a service listening
# on a hardcoded 8080 is marked "no open ports detected" and the deploy fails. Never set
# PORT by hand — locally the 8080 fallback is what applies.
server.port=${PORT:8080}

# Render (like any managed platform) terminates TLS at its edge and forwards plain HTTP to
# the container. Without this, Spring sees scheme=http and an internal host, so every URL
# it builds itself — the ProblemDetail "instance" field, any redirect — points at
# http://10.x instead of the public https origin. "framework" makes Boot register
# ForwardedHeaderFilter, which trusts X-Forwarded-Proto/Host/For.
server.forward-headers-strategy=framework


# ---------------------------------------------------------------------------
# Stability AI
# ---------------------------------------------------------------------------

stability.api.base-url=https://api.stability.ai

# Required. Get one from https://platform.stability.ai/account/keys — it starts with "sk-".
# Exported as STABILITY_API_KEY; the empty default lets the context start without it so the
# test suite runs offline, and the first generation then fails with a 401 from Stability
# rather than a startup error.
stability.api.key=${STABILITY_API_KEY:}

# Text-to-image engine. SDXL is the default because the older stable-diffusion-v1-6 engine
# id was retired and now answers 404.
stability.api.text-engine=${STABILITY_TEXT_ENGINE:stable-diffusion-xl-1024-v1-0}

# Image-to-image engine. Kept as a separate key from the text engine so one can be moved
# without the other; GenerationHistoryService reads both to record which engine produced
# each row.
stability.api.image-engine=${STABILITY_IMAGE_ENGINE:stable-diffusion-xl-1024-v1-0}


# ---------------------------------------------------------------------------
# Multipart uploads  (photo-to-art)
# ---------------------------------------------------------------------------

# Raised from the 1MB Spring default, which rejected ordinary phone photos with an
# HTTP 413 before the handler ever ran. GhibliArtService still enforces Stability's own
# 5MB init_image ceiling itself, and returns a readable 400 for anything larger.
spring.servlet.multipart.max-file-size=20MB
# Kept equal to the file limit: a photo-to-art request is one image plus a short prompt,
# so a smaller request limit would reject uploads the file limit accepts.
spring.servlet.multipart.max-request-size=20MB


# ---------------------------------------------------------------------------
# MongoDB
# ---------------------------------------------------------------------------

# Set MONGODB_URI to the mongodb+srv:// string from Atlas > Connect > Drivers.
#
# The localhost fallback keeps a clean clone runnable, but note it is NOT Atlas: with
# MONGODB_URI unset the app starts happily against a mongod on 127.0.0.1:27017 and nothing
# says so. The fallback is still needed — without it an unset variable binds the literal
# string "${MONGODB_URI}" and later surfaces as a misleading "connection string is invalid".
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ghbli}

# Required, and silent when missing. Spring Data MongoDB defaulted auto-index-creation to
# false in 3.0, so @Indexed(unique = true) on User.email creates no index and enforces
# nothing — two accounts can share one address, and it only shows up much later.
spring.data.mongodb.auto-index-creation=true


# ---------------------------------------------------------------------------
# JWT authentication
# ---------------------------------------------------------------------------

# Required — the application will not start without it. HS256 needs at least 32 bytes of
# key material, and JwtService fails fast with that advice rather than letting jjwt throw a
# WeakKeyException on the first login.
#
#   macOS / Linux:  openssl rand -base64 32
#   PowerShell:     [Convert]::ToBase64String((1..32 | % { Get-Random -Max 256 }))
#
# Exported as JWT_SECRET. Rotating it invalidates every issued token, which logs everyone out.
jwt.secret=${JWT_SECRET:REPLACE_WITH_BASE64_32_BYTE_SECRET}

# Token lifetime in MILLISECONDS (86400000 = 24 hours). AuthResponse.expiresIn reports this
# to the frontend in SECONDS; authStorage.sessionFromAuthResponse does the conversion.
jwt.expiration=86400000


# ---------------------------------------------------------------------------
# CORS  (the single value a deployment has to change)
# ---------------------------------------------------------------------------

# Comma-separated browser origins allowed to call this API, read by
# SecurityConfig#corsConfigurationSource. Exported as CORS_ALLOWED_ORIGINS.
#
# The default below is local development only, and is also what the CORS tests in
# AuthenticationIntegrationTest assert — Vite's dev server is configured onto port 3000 in
# vite.config.mjs, so 5173 is intentionally absent.
#
# On Render, set it to the deployed frontend, no trailing slash and no path:
#   CORS_ALLOWED_ORIGINS=https://ghbli-ai.vercel.app,https://ghbli-ai-*.vercel.app
#
# An entry containing '*' goes to CorsConfiguration.setAllowedOriginPatterns instead of
# setAllowedOrigins, because the latter compares literally and a wildcard there would never
# match. That is what makes Vercel's per-deployment preview URLs work without redeploying
# the backend each time. Origins are matched exactly otherwise: http:// and https:// are
# different origins, and so is a URL with a trailing slash.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}


# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------

# /actuator/health is Render's health check target (healthCheckPath in render.yaml) and the
# URL an uptime pinger hits to keep a free instance from spinning down. It is the only path
# SecurityConfig permits anonymously, so adding endpoints to this line would expose them
# without a token — "info", "env" and "beans" in particular.
management.endpoints.web.exposure.include=health

# Off on purpose. Boot's Mongo indicator folds a live ping into the aggregate status, and
# Render fails a deploy — then keeps failing it — whenever the health check is non-200. With
# the indicator on, a paused Atlas cluster (the free tier pauses after 60 idle days) takes
# down the whole service rather than only the requests that need the database.
management.health.mongo.enabled=false


# ---------------------------------------------------------------------------
# Tests only — src/test/resources/application.properties
# ---------------------------------------------------------------------------
#
# The test classpath copy SHADOWS this file rather than merging with it, so anything the
# tests need has to be set there. It already is; this block is here so the key is
# discoverable from the reference file.
#
# Flapdoodle downloads and runs a real mongod, and picks nothing by default — without this
# the embedded-Mongo autoconfiguration fails at startup with an unhelpful message. Pinned
# rather than "latest" so a new upstream release cannot change what CI runs against.
#
#   de.flapdoodle.mongodb.embedded.version=7.0.14
